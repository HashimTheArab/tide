# Example only: copy into an operator repository's .github/workflows/. Tide's own repository never deploys.
# See docs/deploy.md. Each job reads its token from its own GitHub environment, so production's protection rules
# decide when its job can read its token.
name: Deploy Worker

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    # One deploy per environment at a time. Runs queue in order, so a rerun of an older commit cannot replace the
    # pending head; the head check then refuses the older one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: pnpm install --frozen-lockfile
      # A rerun or a late approval must not deploy an older commit over a newer one.
      - name: Still the head of main
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Deploy
        # The operator project, which holds Wrangler and wrangler.jsonc.
        working-directory: examples/operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - run: pnpm install --frozen-lockfile
      - name: Still the head of main
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Deploy
        working-directory: examples/operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production
