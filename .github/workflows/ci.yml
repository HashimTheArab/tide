name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Betterleaks
        uses: ./.github/actions/betterleaks

      # A failing check exits 1 after the report is written, so the summary prints before the step fails.
      - name: Gate
        run: |
          base=origin/main
          git rev-parse --verify -q "$base" > /dev/null || base=$(git rev-list --max-parents=0 HEAD)
          status=0
          node scripts/gate.mjs --base "$base" --out "$RUNNER_TEMP/gate.json" > /dev/null || status=$?
          jq '{allChecksPassed, tests, checks: (.checks | map_values(.exitCode))}' "$RUNNER_TEMP/gate.json"
          exit "$status"

  # Builds the Node image and runs it over a bucket the CLI publishes; needs docker, so it is not in the gate.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Image smoke test
        run: pnpm test:container

  # Installs the packed packages into a fresh npm project and uses them; nothing is published.
  # Also on the oldest Node the packages' engines field accepts.
  package:
    strategy:
      matrix:
        node: ["", "24.11"]
    name: package (Node ${{ matrix.node || '.nvmrc' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Packed-install test
        run: pnpm test:pack

  # The one check branch protection requires: it passes only when every other job passed.
  check:
    if: ${{ always() }}
    needs: [gate, container, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")'
