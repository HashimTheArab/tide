name: Conformance

# Stock expo-updates release apps on an Android emulator against a local Tide (docs/testing.md, Conformance).
# Nightly and on demand only; the run makes its own signing identity, so it needs no secrets.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  SYSTEM_IMAGE: "system-images;android-36;google_apis;x86_64"
  AVD: conformance

jobs:
  # The matrix is the harness's own version table, so a version added there runs here.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expo: ${{ steps.table.outputs.expo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - id: table
        run: |
          node --input-type=module -e '
            import { EXPO_VERSIONS } from "./conformance/src/options.ts";
            console.log("expo=" + JSON.stringify(Object.keys(EXPO_VERSIONS)));
          ' >> "$GITHUB_OUTPUT"

  android:
    name: Android, expo-updates ${{ matrix.expo }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        expo: ${{ fromJSON(needs.versions.outputs.expo) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # GitHub's documented rule for hardware-accelerated Android emulators on hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The image's default JDK moves with the image; the apps build with 21. The AVD lives in the runner's temp dir.
      - name: JDK 21 and AVD home
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd" >> "$GITHUB_ENV"

      - name: Emulator and AVD
        timeout-minutes: 30
        run: |
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install emulator "$SYSTEM_IMAGE"
          # avdmanager ignores ANDROID_AVD_HOME unless the directory exists. A phone profile, not the default one's
          # 32 MB app heap.
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --name "$AVD" --package "$SYSTEM_IMAGE" --device pixel_6
          printf '%s\n' hw.ramSize=4096 disk.dataPartition.size=6G hw.gpu.enabled=yes \
            hw.gpu.mode=swiftshader_indirect >> "$ANDROID_AVD_HOME/$AVD.avd/config.ini"
          # Puts KVM use in the run log, which the harness only shows when the emulator fails.
          "$ANDROID_HOME/emulator/emulator" -accel-check

      # Boots the AVD read-only, builds the release app and runs every scenario.
      - name: Conformance
        timeout-minutes: 110
        env:
          EXPO: ${{ matrix.expo }}
        run: pnpm conformance --platform android --expo "$EXPO" --avd "$AVD"
